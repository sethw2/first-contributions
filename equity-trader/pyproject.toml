[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "equity-trader"
version = "0.1.0"
description = "Paper-first, risk-controlled short-term equity trading system (30 min to 2 weeks)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "PyYAML>=6.0",
]

[project.optional-dependencies]
live = ["alpaca-py>=0.20.0", "pandas-market-calendars>=4.3.0"]
dev = ["pytest>=7.0"]

[project.scripts]
equity-trader = "run:main"

[tool.setuptools]
packages = ["equity_trader"]

[tool.pytest.ini_options]
testpaths = ["tests"]
